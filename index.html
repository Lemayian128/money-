<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperTrade — Simulated Trading Dashboard</title>
<style>
  :root {
    --bg: #0a0e13;
    --surface: #121820;
    --surface-2: #1a222d;
    --border: #232e3c;
    --text: #e6edf5;
    --muted: #7d8fa3;
    --green: #22c55e;
    --green-dim: #16a34a;
    --red: #ef4444;
    --red-dim: #dc2626;
    --accent: #3b82f6;
    --radius: 10px;
    --mono: 'SF Mono', 'Consolas', 'Monaco', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }

  /* ---------- Top Bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 14, 19, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.02em;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    display: grid;
    place-items: center;
    font-size: 0.85rem;
    font-weight: 800;
    color: #fff;
  }

  .paper-tag {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--accent);
    background: rgba(59, 130, 246, 0.12);
    border: 1px solid rgba(59, 130, 246, 0.3);
    padding: 3px 8px;
    border-radius: 5px;
  }

  .portfolio-summary {
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .summary-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .summary-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
  }

  .summary-value {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .up { color: var(--green); }
  .down { color: var(--red); }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr 320px;
    gap: 16px;
    padding: 16px;
    max-width: 1600px;
    margin: 0 auto;
  }

  @media (max-width: 1200px) {
    .layout { grid-template-columns: 220px 1fr; }
    .order-panel { grid-column: 1 / -1; }
  }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---------- Panels ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 700;
  }

  /* ---------- Watchlist ---------- */
  .watchlist { max-height: 520px; overflow-y: auto; }

  .ticker {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .ticker:hover { background: var(--surface-2); }

  .ticker.active {
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    padding-left: 13px;
  }

  .ticker-symbol {
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }

  .ticker-name {
    font-size: 0.7rem;
    color: var(--muted);
  }

  .ticker-price {
    text-align: right;
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .ticker-change {
    font-size: 0.7rem;
    font-family: var(--mono);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Chart ---------- */
  .chart-area {
    padding: 16px;
    position: relative;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .chart-symbol {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .chart-price {
    font-family: var(--mono);
    font-size: 1.8rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  .chart-meta {
    display: flex;
    gap: 20px;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .chart-meta strong {
    color: var(--text);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  canvas {
    width: 100%;
    height: 280px;
    display: block;
    border-radius: 6px;
  }

  /* ---------- Order Panel ---------- */
  .order-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }

  .order-tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    background: none;
    border: none;
    color: var(--muted);
    transition: all 0.15s;
    font-family: inherit;
  }

  .order-tab.active.buy {
    color: var(--green);
    background: rgba(34, 197, 94, 0.08);
    border-bottom: 2px solid var(--green);
  }

  .order-tab.active.sell {
    color: var(--red);
    background: rgba(239, 68, 68, 0.08);
    border-bottom: 2px solid var(--red);
  }

  .order-form { padding: 16px; }

  .form-group { margin-bottom: 14px; }

  .form-label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .form-input {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-input:focus { border-color: var(--accent); }

  .qty-buttons {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }

  .qty-btn {
    flex: 1;
    padding: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .qty-btn:hover { color: var(--text); border-color: var(--accent); }

  .order-summary {
    background: var(--surface-2);
    border-radius: 7px;
    padding: 12px;
    margin-bottom: 14px;
    font-size: 0.78rem;
  }

  .summary-line {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .summary-line:last-child {
    margin-bottom: 0;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    font-weight: 700;
  }

  .summary-line span:last-child {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .submit-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 7px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .submit-btn:hover { opacity: 0.9; }
  .submit-btn.buy { background: var(--green-dim); }
  .submit-btn.sell { background: var(--red-dim); }

  /* ---------- Positions Table ---------- */
  .positions { width: 100%; border-collapse: collapse; }

  .positions th {
    text-align: left;
    padding: 10px 16px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }

  .positions th:not(:first-child) { text-align: right; }

  .positions td {
    padding: 11px 16px;
    font-size: 0.82rem;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }

  .positions td:not(:first-child) {
    text-align: right;
    font-family: var(--mono);
  }

  .positions tr:last-child td { border-bottom: none; }
  .positions tr:hover { background: var(--surface-2); }

  .empty-state {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
  }

  .flash {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 14px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    z-index: 200;
    animation: slideUp 0.3s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="brand">
      <div class="brand-mark">P</div>
      PaperTrade
    </div>
    <span class="paper-tag">Simulated</span>
  </div>
  <div class="portfolio-summary">
    <div class="summary-item">
      <span class="summary-label">Cash</span>
      <span class="summary-value" id="cashDisplay">$100,000.00</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Positions</span>
      <span class="summary-value" id="positionsValue">$0.00</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Total Equity</span>
      <span class="summary-value" id="equityDisplay">$100,000.00</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Day P&L</span>
      <span class="summary-value" id="pnlDisplay">$0.00</span>
    </div>
  </div>
</div>

<div class="layout">

  <!-- LEFT: Watchlist -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Watchlist</span>
    </div>
    <div class="watchlist" id="watchlist"></div>
  </div>

  <!-- CENTER: Chart -->
  <div class="panel">
    <div class="chart-area">
      <div class="chart-header">
        <div>
          <div class="chart-symbol" id="chartSymbol">AAPL</div>
          <div class="chart-price" id="chartPrice">$0.00</div>
        </div>
        <div class="chart-meta">
          <div>Open <strong id="metaOpen">—</strong></div>
          <div>High <strong id="metaHigh">—</strong></div>
          <div>Low <strong id="metaLow">—</strong></div>
          <div>Vol <strong id="metaVol">—</strong></div>
        </div>
      </div>
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- RIGHT: Order Panel -->
  <div class="panel order-panel">
    <div class="order-tabs">
      <button class="order-tab buy active" id="tabBuy">Buy</button>
      <button class="order-tab sell" id="tabSell">Sell</button>
    </div>
    <div class="order-form">
      <div class="form-group">
        <label class="form-label">Quantity (shares)</label>
        <input type="number" class="form-input" id="qtyInput" value="10" min="1" step="1">
        <div class="qty-buttons">
          <button class="qty-btn" data-qty="10">10</button>
          <button class="qty-btn" data-qty="25">25</button>
          <button class="qty-btn" data-qty="50">50</button>
          <button class="qty-btn" data-qty="100">100</button>
        </div>
      </div>
      <div class="order-summary">
        <div class="summary-line">
          <span>Market Price</span>
          <span id="sumPrice">$0.00</span>
        </div>
        <div class="summary-line">
          <span>Estimated Cost</span>
          <span id="sumCost">$0.00</span>
        </div>
        <div class="summary-line">
          <span>Buying Power</span>
          <span id="sumBP">$100,000.00</span>
        </div>
      </div>
      <button class="submit-btn buy" id="submitBtn">Place Buy Order</button>
    </div>
  </div>
</div>

<!-- Positions Table -->
<div style="padding: 0 16px 24px; max-width: 1600px; margin: 0 auto;">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Open Positions</span>
      <span class="panel-title" id="posCount">0 positions</span>
    </div>
    <table class="positions">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Qty</th>
          <th>Avg Cost</th>
          <th>Market Price</th>
          <th>Market Value</th>
          <th>Unrealized P&L</th>
        </tr>
      </thead>
      <tbody id="positionsBody"></tbody>
    </table>
  </div>
</div>

<script>
/* =========================================================
   PaperTrade — simulated trading dashboard
   All prices are randomly generated. No real money involved.
   ========================================================= */

// ---------- Instruments ----------
const INSTRUMENTS = {
  AAPL:  { name: 'Apple Inc.',         price: 189.42, vol: 0.018 },
  MSFT:  { name: 'Microsoft Corp.',    price: 412.88, vol: 0.016 },
  GOOGL: { name: 'Alphabet Inc.',      price: 156.23, vol: 0.020 },
  AMZN:  { name: 'Amazon.com Inc.',    price: 178.65, vol: 0.022 },
  TSLA:  { name: 'Tesla Inc.',         price: 248.90, vol: 0.035 },
  NVDA:  { name: 'NVIDIA Corp.',       price: 875.30, vol: 0.028 },
  META:  { name: 'Meta Platforms',     price: 505.12, vol: 0.024 },
  BTC:   { name: 'Bitcoin / USD',      price: 67420.0, vol: 0.040 }
};

// ---------- State ----------
const state = {
  cash: 100000,
  active: 'AAPL',
  orderSide: 'buy',
  positions: {},           // { SYMBOL: { qty, avgCost } }
  prices: {},              // { SYMBOL: currentPrice }
  history: {},             // { SYMBOL: [prices...] }
  dayOpen: {},
  dayHigh: {},
  dayLow: {}
};

// Initialize prices and history
Object.keys(INSTRUMENTS).forEach(sym => {
  const p = INSTRUMENTS[sym].price;
  state.prices[sym] = p;
  state.dayOpen[sym] = p;
  state.dayHigh[sym] = p;
  state.dayLow[sym] = p;
  state.history[sym] = Array.from({ length: 60 }, () => p);
});

// ---------- Utilities ----------
const fmtMoney = n => '$' + n.toLocaleString('en-US', {
  minimumFractionDigits: 2, maximumFractionDigits: 2
});
const fmtNum = n => n.toLocaleString('en-US', {
  minimumFractionDigits: 2, maximumFractionDigits: 2
});
const rand = (min, max) => Math.random() * (max - min) + min;

// ---------- Price Simulation (Geometric Brownian-ish) ----------
function simulatePrices() {
  Object.keys(INSTRUMENTS).forEach(sym => {
    const vol = INSTRUMENTS[sym].vol;
    const prev = state.prices[sym];
    const drift = rand(-vol, vol) * prev;
    const next = Math.max(0.01, prev + drift);

    state.prices[sym] = next;
    state.dayHigh[sym] = Math.max(state.dayHigh[sym], next);
    state.dayLow[sym] = Math.min(state.dayLow[sym], next);

    state.history[sym].push(next);
    if (state.history[sym].length > 60) state.history[sym].shift();
  });

  renderAll();
}

// ---------- Portfolio Calculations ----------
function positionsValue() {
  return Object.entries(state.positions).reduce((sum, [sym, pos]) => {
    return sum + pos.qty * state.prices[sym];
  }, 0);
}

function unrealizedPnL() {
  return Object.entries(state.positions).reduce((sum, [sym, pos]) => {
    return sum + (state.prices[sym] - pos.avgCost) * pos.qty;
  }, 0);
}

// ---------- Rendering: Watchlist ----------
function renderWatchlist() {
  const el = document.getElementById('watchlist');
  el.innerHTML = '';

  Object.entries(INSTRUMENTS).forEach(([sym, inst]) => {
    const price = state.prices[sym];
    const open = state.dayOpen[sym];
    const change = price - open;
    const changePct = (change / open) * 100;
    const isUp = change >= 0;

    const div = document.createElement('div');
    div.className = 'ticker' + (sym === state.active ? ' active' : '');
    div.innerHTML = `
      <div>
        <div class="ticker-symbol">${sym}</div>
        <div class="ticker-name">${inst.name}</div>
      </div>
      <div>
        <div class="ticker-price">${fmtNum(price)}</div>
        <div class="ticker-change ${isUp ? 'up' : 'down'}">
          ${isUp ? '+' : ''}${changePct.toFixed(2)}%
        </div>
      </div>
    `;
    div.addEventListener('click', () => {
      state.active = sym;
      renderAll();
    });
    el.appendChild(div);
  });
}

// ---------- Rendering: Chart (Canvas) ----------
function renderChart() {
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;
  const pad = 20;

  ctx.clearRect(0, 0, w, h);

  const data = state.history[state.active];
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;

  const xStep = (w - pad * 2) / (data.length - 1);
  const yScale = v => h - pad - ((v - min) / range) * (h - pad * 2);

  // Grid lines
  ctx.strokeStyle = 'rgba(35, 46, 60, 0.6)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad + (i / 4) * (h - pad * 2);
    ctx.beginPath();
    ctx.moveTo(pad, y);
    ctx.lineTo(w - pad, y);
    ctx.stroke();
  }

  // Determine trend color
  const isUp = data[data.length - 1] >= data[0];
  const lineColor = isUp ? '#22c55e' : '#ef4444';

  // Area fill
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, isUp ? 'rgba(34, 197, 94, 0.25)' : 'rgba(239, 68, 68, 0.25)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

  ctx.beginPath();
  ctx.moveTo(pad, h - pad);
  data.forEach((v, i) => {
    ctx.lineTo(pad + i * xStep, yScale(v));
  });
  ctx.lineTo(w - pad, h - pad);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  // Line
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = pad + i * xStep;
    const y = yScale(v);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Last price dot
  const lastX = pad + (data.length - 1) * xStep;
  const lastY = yScale(data[data.length - 1]);
  ctx.beginPath();
  ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
  ctx.fillStyle = lineColor;
  ctx.fill();
}

// ---------- Rendering: Chart Header ----------
function renderChartHeader() {
  const sym = state.active;
  const price = state.prices[sym];
  const open = state.dayOpen[sym];
  const change = price - open;
  const pct = (change / open) * 100;
  const isUp = change >= 0;

  document.getElementById('chartSymbol').textContent = sym;

  const priceEl = document.getElementById('chartPrice');
  priceEl.textContent = fmtMoney(price);
  priceEl.className = 'chart-price ' + (isUp ? 'up' : 'down');

  document.getElementById('metaOpen').textContent = fmtNum(open);
  document.getElementById('metaHigh').textContent = fmtNum(state.dayHigh[sym]);
  document.getElementById('metaLow').textContent = fmtNum(state.dayLow[sym]);
  document.getElementById('metaVol').textContent =
    (rand(1, 9) * 10).toFixed(1) + 'M';
}

// ---------- Rendering: Order Summary ----------
function renderOrderSummary() {
  const price = state.prices[state.active];
  const qty = parseInt(document.getElementById('qtyInput').value) || 0;

  document.getElementById('sumPrice').textContent = fmtMoney(price);
  document.getElementById('sumCost').textContent = fmtMoney(price * qty);
  document.getElementById('sumBP').textContent = fmtMoney(state.cash);
}

// ---------- Rendering: Portfolio ----------
function renderPortfolio() {
  document.getElementById('cashDisplay').textContent = fmtMoney(state.cash);

  const posVal = positionsValue();
  document.getElementById('positionsValue').textContent = fmtMoney(posVal);
  document.getElementById('equityDisplay').textContent =
    fmtMoney(state.cash + posVal);

  const pnl = unrealizedPnL();
  const pnlEl = document.getElementById('pnlDisplay');
  pnlEl.textContent = (pnl >= 0 ? '+' : '') + fmtMoney(pnl);
  pnlEl.className = 'summary-value ' + (pnl >= 0 ? 'up' : 'down');
}

// ---------- Rendering: Positions Table ----------
function renderPositions() {
  const tbody = document.getElementById('positionsBody');
  const entries = Object.entries(state.positions);

  document.getElementById('posCount').textContent =
    entries.length + (entries.length === 1 ? ' position' : ' positions');

  if (entries.length === 0) {
    tbody.innerHTML = `
      <tr><td colspan="6" class="empty-state">
        No open positions. Place a buy order to get started.
      </td></tr>
    `;
    return;
  }

  tbody.innerHTML = '';
  entries.forEach(([sym, pos]) => {
    const mktPrice = state.prices[sym];
    const mktValue = pos.qty * mktPrice;
    const pnl = (mktPrice - pos.avgCost) * pos.qty;
    const pnlPct = ((mktPrice - pos.avgCost) / pos.avgCost) * 100;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:700">${sym}</td>
      <td>${pos.qty}</td>
      <td>${fmtNum(pos.avgCost)}</td>
      <td>${fmtNum(mktPrice)}</td>
      <td>${fmtMoney(mktValue)}</td>
      <td class="${pnl >= 0 ? 'up' : 'down'}">
        ${pnl >= 0 ? '+' : ''}${fmtMoney(pnl)}
        (${pnl >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%)
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// ---------- Master Render ----------
function renderAll() {
  renderWatchlist();
  renderChartHeader();
  renderChart();
  renderOrderSummary();
  renderPortfolio();
  renderPositions();
}

// ---------- Order Logic ----------
function placeOrder() {
  const sym = state.active;
  const qty = parseInt(document.getElementById('qtyInput').value) || 0;

  if (qty <= 0) {
    flash('Enter a valid quantity.', 'error');
    return;
  }

  const price = state.prices[sym];
  const cost = price * qty;

  if (state.orderSide === 'buy') {
    if (cost > state.cash) {
      flash('Insufficient buying power.', 'error');
      return;
    }
    state.cash -= cost;

    const existing = state.positions[sym];
    if (existing) {
      const totalQty = existing.qty + qty;
      const newAvg =
        (existing.qty * existing.avgCost + qty * price) / totalQty;
      existing.qty = totalQty;
      existing.avgCost = newAvg;
    } else {
      state.positions[sym] = { qty, avgCost: price };
    }

    flash(`Bought ${qty} ${sym} @ ${fmtMoney(price)}`, 'success');
  } else {
    const pos = state.positions[sym];
    if (!pos || pos.qty < qty) {
      flash(`You don't own ${qty} shares of ${sym}.`, 'error');
      return;
    }

    state.cash += cost;
    pos.qty -= qty;
    if (pos.qty === 0) delete state.positions[sym];

    flash(`Sold ${qty} ${sym} @ ${fmtMoney(price)}`, 'success');
  }

  renderAll();
}

// ---------- Flash Message ----------
function flash(msg, type) {
  const el = document.createElement('div');
  el.className = 'flash';
  el.style.borderLeftColor = type === 'error' ? '#ef4444' : '#22c55e';
  el.textContent = msg;
  document.body.appendChild(el);

  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(() => el.remove(), 300);
  }, 2200);
}

// ---------- Event Wiring ----------
document.getElementById('tabBuy').addEventListener('click', () => {
  state.orderSide = 'buy';
  document.getElementById('tabBuy').classList.add('active', 'buy');
  document.getElementById('tabSell').classList.remove('active', 'sell');
  const btn = document.getElementById('submitBtn');
  btn.textContent = 'Place Buy Order';
  btn.className = 'submit-btn buy';
});

document.getElementById('tabSell').addEventListener('click', () => {
  state.orderSide = 'sell';
  document.getElementById('tabSell').classList.add('active', 'sell');
  document.getElementById('tabBuy').classList.remove('active', 'buy');
  const btn = document.getElementById('submitBtn');
  btn.textContent = 'Place Sell Order';
  btn.className = 'submit-btn sell';
});

document.getElementById('qtyInput').addEventListener('input', renderOrderSummary);

document.querySelectorAll('.qty-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('qtyInput').value = btn.dataset.qty;
    renderOrderSummary();
  });
});

document.getElementById('submitBtn').addEventListener('click', placeOrder);

window.addEventListener('resize', renderChart);

// ---------- Init ----------
renderAll();
setInterval(simulatePrices, 2000);
</script>
